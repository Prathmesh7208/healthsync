services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + Prisma)
  # ----------------------------------------------------------------------------
  - type: web
    name: healthsync-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && (npm run prisma:seed || true) && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: healthsync-db
          property: connectionString

  # ----------------------------------------------------------------------------
  # 2. Frontend Web App (Vite + React Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: healthsync-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://healthsync-api-1h37.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ----------------------------------------------------------------------------
# 3. PostgreSQL Managed Database
# ----------------------------------------------------------------------------
databases:
  - name: healthsync-db
    plan: free
    databaseName: healthsync_db
    user: healthsync_user
