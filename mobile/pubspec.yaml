name: healthsync_mobile
description: A healthcare ecosystem connecting patients, doctors, and clinics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.0

  # Routing
  go_router: ^12.1.3

  # Networking
  dio: ^5.3.3
  pretty_dio_logger: ^1.3.1

  # Local Storage & Security
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Localization
  intl: ^0.20.2

  # UI & Utilities
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0
  pdf: ^3.10.7
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_localizations:
    sdk: flutter

  # Serialization
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
