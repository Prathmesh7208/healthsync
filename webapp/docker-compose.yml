version: '3.8'

services:
  webapp:
    build: .
    container_name: healthsync_webapp
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/usr/src/app/data/healthsync.db
    volumes:
      # Mount a local directory to persist the SQLite database outside the container
      - ./data:/usr/src/app/data
    restart: always
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: healthsync_postgres
    environment:
      POSTGRES_USER: healthsync_user
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: healthsync_db
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: always
